# Build and push Bluefox Outline image to GHCR.
name: image
on:
  push:
    branches: ["bluefox/0.82.0"]
    tags: ["0.82.0-bf*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.82.0-bf1)"
        required: true
        default: "0.82.0-bf1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="0.82.0-bf1"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/bluefoxsv/outline:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build outline-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          load: true
          tags: outlinewiki/outline-base:latest
          cache-from: type=gha,scope=outline-base
          cache-to: type=gha,mode=max,scope=outline-base

      - name: Build and push outline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/bluefoxsv/outline:0.82.0-bf1
          cache-from: type=gha,scope=outline
          cache-to: type=gha,mode=max,scope=outline

      - name: Summary
        run: |
          echo "Pushed ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
